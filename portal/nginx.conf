# Behind the HTTPS proxy (deploy/nginx) the browser's scheme arrives in
# X-Forwarded-Proto; keep it instead of overwriting it with this hop's "http".
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80;
  server_name _;

  # nginx defaults to 1m, which silently 413s any upload above that - applicant
  # document uploads (scanned IDs, clinical abstracts, etc.) need more headroom.
  client_max_body_size 320m;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:5001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  location /uploads/ {
    proxy_pass http://backend:5001/uploads/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  # index.html names the hashed JS/CSS files of the current build. Without this
  # browsers keep an old copy after a deploy and load the previous version of the app.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
