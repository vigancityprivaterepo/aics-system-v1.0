# HTTPS entry point for the AICS stack.
#   https://aics.vigan.internal          staff app      (inside the network)
#   https://portal.aics.vigan.internal   portal         (inside the network)
#   https://<server IP>:8081             staff app      (public or internal IP)
#   https://<server IP>:8082             portal         (public or internal IP)
# Docker maps host 8081 -> 443 and host 8082 -> 8443 here (docker-compose.production.yml).
# One certificate covers the names and the IPs; see deploy/make-certs.sh.

# Where plain-HTTP port 80 sends people: names keep their name, an IP goes to the
# staff app on :8081, anything else goes to the staff app's name.
map $host $https_target {
  portal.aics.vigan.internal    portal.aics.vigan.internal;
  aics.vigan.internal           aics.vigan.internal;
  "~^\d+\.\d+\.\d+\.\d+$"       $host:8081;
  default                       aics.vigan.internal;
}

server {
  listen 80 default_server;
  server_name _;

  # Served over plain HTTP so a device that does not trust it yet can download it.
  location = /aics-root-ca.crt {
    alias /etc/nginx/certs/aics-root-ca.crt;
    default_type application/x-x509-ca-cert;
  }

  location / {
    return 301 https://$https_target$request_uri;
  }
}

# Staff app. default_server because browsers send no server name when the
# address is an IP, so IP visitors (host port 8081) land here.
server {
  listen 443 ssl default_server;
  http2 on;
  server_name aics.vigan.internal;

  include /etc/nginx/conf.d/tls.inc;

  # Also offered here for outside users, who only reach 8081/8082: the browser
  # warns once (the CA is not trusted yet), then the file downloads.
  location = /aics-root-ca.crt {
    alias /etc/nginx/certs/aics-root-ca.crt;
    default_type application/x-x509-ca-cert;
  }

  location / {
    proxy_pass http://frontend:80;
    include /etc/nginx/conf.d/proxy-headers.inc;
  }
}

# Portal by name on 443, and by IP on 8443 (host port 8082).
server {
  listen 443 ssl;
  listen 8443 ssl default_server;
  http2 on;
  server_name portal.aics.vigan.internal;

  include /etc/nginx/conf.d/tls.inc;

  location / {
    proxy_pass http://portal:80;
    include /etc/nginx/conf.d/proxy-headers.inc;
  }
}
