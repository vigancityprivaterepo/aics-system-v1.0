services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-aics_db}
    volumes:
      - aics_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./.env.production
    volumes:
      - aics_uploads:/app/backend/uploads
      - aics_backups:/app/backend/backups
    ports:
      - "${BACKEND_BIND_HOST:-127.0.0.1}:${BACKEND_PORT:-5101}:5001"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # No host port: reached only through the proxy, which owns 8081.

  portal:
    build:
      context: ./portal
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # No host port: reached only through the proxy, which owns 8082.

  # HTTPS entry point.
  #   443:  https://aics.vigan.internal and https://portal.aics.vigan.internal
  #   8081: staff app by IP (https://103.72.59.246:8081)  -> proxy 443
  #   8082: portal by IP    (https://103.72.59.246:8082)  -> proxy 8443
  # Needs deploy/certs from deploy/make-certs.sh. HTTP on port 80 redirects to HTTPS.
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - portal
    volumes:
      - ./deploy/nginx:/etc/nginx/conf.d:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    ports:
      - "${PROXY_BIND_HOST:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${PROXY_BIND_HOST:-0.0.0.0}:${HTTPS_PORT:-443}:443"
      - "${PROXY_BIND_HOST:-0.0.0.0}:${STAFF_IP_PORT:-8081}:443"
      - "${PROXY_BIND_HOST:-0.0.0.0}:${PORTAL_IP_PORT:-8082}:8443"

volumes:
  aics_pg_data:
  aics_uploads:
  aics_backups:
